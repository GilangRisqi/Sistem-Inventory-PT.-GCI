<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Password Toggle</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background-color: #f8f9fa;
        padding: 2rem;
        margin: 0;
      }

      .test-container {
        max-width: 400px;
        margin: 0 auto;
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #334155;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .password-input-wrapper {
        position: relative;
        display: block;
      }

      .password-input-wrapper input {
        width: 100% !important;
        padding: 1rem !important;
        padding-right: 2.8rem !important;
        border: 2px solid #cbd5e1 !important;
        border-radius: 8px !important;
        font-size: 1rem !important;
        background-color: white !important;
        color: #334155 !important;
        transition: border-color 0.3s ease !important;
        box-sizing: border-box !important;
        font-family: inherit !important;
        line-height: 1.5 !important;
        margin: 0 !important;
        min-height: auto !important;
        appearance: none !important;
        -webkit-appearance: none !important;
      }

      .password-input-wrapper input:focus {
        border-color: #38bdf8 !important;
        outline: none !important;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1) !important;
      }

      .password-input-wrapper:hover input {
        border-color: rgba(56, 189, 248, 0.3) !important;
      }

      .password-toggle-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        padding: 6px;
        cursor: pointer;
        color: #cbd5e1;
        transition: color 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        width: 32px;
        height: 32px;
        z-index: 10;
      }

      .password-toggle-btn:hover {
        color: #38bdf8;
        background-color: rgba(56, 189, 248, 0.05);
      }

      .password-toggle-btn:focus {
        outline: none;
        color: #38bdf8;
        background-color: rgba(56, 189, 248, 0.1);
      }

      .password-toggle-btn i {
        font-size: 1rem;
        pointer-events: none;
      }

      .test-button {
        width: 100%;
        padding: 1rem;
        background: #38bdf8;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .test-button:hover {
        background: #2563eb;
      }

      .regular-input {
        width: 100% !important;
        padding: 1rem !important;
        border: 2px solid #cbd5e1 !important;
        border-radius: 8px !important;
        font-size: 1rem !important;
        background-color: white !important;
        color: #334155 !important;
        transition: border-color 0.3s ease !important;
        box-sizing: border-box !important;
        font-family: inherit !important;
        line-height: 1.5 !important;
        margin: 0 !important;
        min-height: auto !important;
        appearance: none !important;
        -webkit-appearance: none !important;
      }

      .regular-input:focus {
        border-color: #38bdf8 !important;
        outline: none !important;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1) !important;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <h2 style="text-align: center; margin-bottom: 2rem; color: #334155">
        Test Password Visibility Toggle
      </h2>

      <form>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="regular-input"
            placeholder="Enter username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
            />
            <button
              type="button"
              class="password-toggle-btn"
              id="password-toggle"
              aria-label="Toggle password visibility"
            >
              <i class="bi bi-eye" id="password-toggle-icon"></i>
            </button>
          </div>
        </div>

        <button type="button" class="test-button" onclick="testValues()">
          Test Values
        </button>
      </form>

      <div
        id="result"
        style="
          margin-top: 1rem;
          padding: 1rem;
          background: #f1f5f9;
          border-radius: 8px;
          display: none;
        "
      >
        <strong>Values:</strong><br />
        <span id="result-text"></span>
      </div>
    </div>

    <script>
      // Initialize password toggle functionality
      function initializePasswordToggle() {
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.getElementById("password-toggle");
        const toggleIcon = document.getElementById("password-toggle-icon");

        if (passwordInput && toggleBtn && toggleIcon) {
          toggleBtn.addEventListener("click", () => {
            // Toggle password visibility
            if (passwordInput.type === "password") {
              passwordInput.type = "text";
              toggleIcon.className = "bi bi-eye-slash";
              toggleBtn.setAttribute("aria-label", "Hide password");
            } else {
              passwordInput.type = "password";
              toggleIcon.className = "bi bi-eye";
              toggleBtn.setAttribute("aria-label", "Show password");
            }
          });

          // Prevent form submission when clicking toggle button
          toggleBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
          });
        }
      }

      // Test function to show values
      function testValues() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const resultDiv = document.getElementById("result");
        const resultText = document.getElementById("result-text");

        resultText.innerHTML = `
                Username: <code>${username || "(empty)"}</code><br>
                Password: <code>${password || "(empty)"}</code>
            `;

        resultDiv.style.display = "block";
      }

      // Initialize when page loads
      document.addEventListener("DOMContentLoaded", function () {
        initializePasswordToggle();

        // Set default test values
        document.getElementById("username").value = "admin";
        document.getElementById("password").value = "admin123";
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SweetAlert2 Test - Sistem Inventory PT GCI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }
      .test-container {
        max-width: 800px;
        margin: 50px auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        padding: 40px;
      }
      .btn-custom {
        margin: 10px;
        padding: 12px 30px;
        border-radius: 10px;
        font-weight: 500;
        transition: all 0.3s ease;
        border: none;
      }
      .btn-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      }
      .header {
        text-align: center;
        margin-bottom: 40px;
      }
      .header h1 {
        color: #2d3748;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .header p {
        color: #4a5568;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="test-container">
      <div class="header">
        <h1>🎨 SweetAlert2 Integration Test</h1>
        <p>Testing professional alerts for Sistem Inventory PT GCI</p>
        <div class="alert alert-success" role="alert">
          ✅ <strong>Update Complete!</strong> DailyReportView &
          IridesseReportView kini menggunakan SweetAlert2
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <h4>Basic Alerts</h4>
          <button id="testSuccess" class="btn btn-success btn-custom">
            ✅ Success Alert
          </button>
          <button id="testError" class="btn btn-danger btn-custom">
            ❌ Error Alert
          </button>
          <button id="testWarning" class="btn btn-warning btn-custom">
            ⚠️ Warning Alert
          </button>
          <button id="testInfo" class="btn btn-info btn-custom">
            ℹ️ Info Alert
          </button>
        </div>
        <div class="col-md-6">
          <h4>Interactive Alerts</h4>
          <button id="testConfirm" class="btn btn-primary btn-custom">
            ❓ Confirmation
          </button>
          <button id="testLoading" class="btn btn-secondary btn-custom">
            ⏳ Loading
          </button>
          <button id="testToast" class="btn btn-dark btn-custom">
            🍞 Toast
          </button>
          <button id="testPDF" class="btn btn-outline-primary btn-custom">
            📄 PDF Success
          </button>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12">
          <h4>Application Specific Tests</h4>
          <button id="testDataSave" class="btn btn-success btn-custom">
            💾 Data Save
          </button>
          <button id="testDataDelete" class="btn btn-danger btn-custom">
            🗑️ Data Delete
          </button>
          <button id="testBahanBakuBlock" class="btn btn-warning btn-custom">
            🚫 Bahan Baku Access
          </button>
        </div>
      </div>

      <div class="mt-5 text-center">
        <a href="../index.html" class="btn btn-outline-secondary"
          >← Kembali ke Aplikasi</a
        >
      </div>
    </div>

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module">
      // Import our SweetAlert utility
      import { sweetAlert } from "./js/utils/SweetAlertUtil.js";

      // Test buttons
      document.getElementById("testSuccess").addEventListener("click", () => {
        sweetAlert.success(
          "Data berhasil disimpan ke database!",
          "Operasi Berhasil!"
        );
      });

      document.getElementById("testError").addEventListener("click", () => {
        sweetAlert.error(
          "Koneksi ke database terputus. Silahkan coba lagi.",
          "Terjadi Kesalahan!"
        );
      });

      document.getElementById("testWarning").addEventListener("click", () => {
        sweetAlert.warning(
          "Akses ke menu Inventory Bahan Baku sedang dinonaktifkan untuk sementara waktu.",
          "Akses Dibatasi"
        );
      });

      document.getElementById("testInfo").addEventListener("click", () => {
        sweetAlert.info(
          "Fitur ini akan segera tersedia dalam update berikutnya.",
          "Informasi"
        );
      });

      document
        .getElementById("testConfirm")
        .addEventListener("click", async () => {
          const result = await sweetAlert.confirm(
            "Data yang dihapus tidak dapat dikembalikan lagi.",
            "Apakah Anda yakin ingin menghapus data ini?",
            {
              confirmButtonText: "Ya, Hapus!",
              cancelButtonText: "Batal",
            }
          );

          if (result.isConfirmed) {
            sweetAlert.success("Data telah dihapus!", "Berhasil!");
          } else {
            sweetAlert.info("Penghapusan dibatalkan", "Dibatalkan");
          }
        });

      document.getElementById("testLoading").addEventListener("click", () => {
        sweetAlert.loading("Sedang memproses data...", "Mohon Tunggu");

        // Simulate loading
        setTimeout(() => {
          sweetAlert.close();
          sweetAlert.success("Proses selesai!", "Berhasil!");
        }, 3000);
      });

      document.getElementById("testToast").addEventListener("click", () => {
        sweetAlert.toast("Notifikasi toast berhasil!", "success", 3000);
      });

      document.getElementById("testPDF").addEventListener("click", () => {
        sweetAlert.pdfSuccess("Laporan_Daily_Report_2024-10-21.pdf");
      });

      document.getElementById("testDataSave").addEventListener("click", () => {
        sweetAlert.dataSuccess(
          "save",
          "Data laporan daily report berhasil disimpan"
        );
      });

      document
        .getElementById("testDataDelete")
        .addEventListener("click", async () => {
          const result = await sweetAlert.confirm(
            "Data yang dihapus tidak dapat dikembalikan lagi.",
            "Apakah Anda yakin ingin menghapus laporan No. 001 tanggal 2024-10-21?",
            {
              confirmButtonText: "Ya, Hapus!",
              cancelButtonText: "Batal",
            }
          );

          if (result.isConfirmed) {
            sweetAlert.dataSuccess(
              "delete",
              "Laporan berhasil dihapus dari sistem"
            );
          }
        });

      document
        .getElementById("testBahanBakuBlock")
        .addEventListener("click", () => {
          sweetAlert.warning(
            "Akses ke menu Inventory Bahan Baku sedang dinonaktifkan untuk sementara waktu.",
            "Akses Dibatasi"
          );
        });
    </script>
  </body>
</html>
